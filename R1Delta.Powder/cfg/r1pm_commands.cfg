// Commands only: no bind, autosprint, updaterate, screenshot or config writes.
alias "+r1pm_grapple" "r1grapple_down"
alias "-r1pm_grapple" "r1grapple_up"
alias "+r1pm_slide" "r1grapple_release; -speed; +duck; r1slide_down"
alias "-r1pm_slide" "-duck; r1slide_up"
alias "+r1pm_slide_toggle" "+toggle_duck; r1slide_toggle"
alias "-r1pm_slide_toggle" "-toggle_duck"
